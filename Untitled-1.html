<!DOCTYPE HTML>
<html>
    <head>
        <style>
            body {
                margin: 0px;
            }
            .container-main {
                display: flex;
            }
            .container-nav {
                display: flex;
                flex-direction: column;
                margin: 20px;
                width: 100vw;
                gap: 10px;
            }
            .content {
                background-color: rgb(25, 51, 43);
                height: 100vh;
                width: 100vw;
            }
            #sidebar {
                display: flex;
                align-items: center;
                width: 200px;
                height: 100vh;
                background-color: rgb(56, 56, 56);
            }
            #first-row {
                display: flex;
                justify-content: center;
                gap: 30px;
                padding-top: 30px;
                width: 100%;
                height: 50vh;
                background-color: rgb(148, 148, 148);
            }
            #second-row {
                display: flex;
                justify-content: center;
            }
            #box1, #box2 {
                flex-direction: column;
            }
            #box1 {
                background-color: beige;
                width: 150px;
                height: 150px;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            #box2 {
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: yellow;
                width: 150px;
                height: 150px;
            }
            #box3 {
                display: flex;
                justify-content: center;
                align-items: center;
                background-repeat: no-repeat;
                width: 100vw;
                height: 100vh
            }
            #box1 #img, #box2 #img {
                margin-top: 20px;
                width: 100px;
                height: 100px;
                background-image: url(dog.jpg);
            }
        </style>
    </head>
    <body>
        <div class="container-main">
            <div id="sidebar">
                <div class="container-nav">
                    <button>Home</button>
                    <button>About</button>
                    <button>Projects</button>
                    <button>Contact</button>
                </div>
            </div>
            <div class="content">
                <div id="first-row">
                    <div id="box1">
                        <div id="img"></div>
                        <span>text</span>
                    </div>
                    <div id="box2">
                        <div id="img"></div>
                        <span>text</span>
                    </div>
                </div>
                <div id="second-row">
                    <div src="Airbus-beluga.jpg" id="box3"></div>
                </div>
            </div>
        </div>
    </body>
</html>
